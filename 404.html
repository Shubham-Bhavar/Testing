<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page Not Found — GiftGenius</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root{
    --cream:#E6F7FA; --gold:#B8791A; --gold-light:#D4AF37; --gold-dim:rgba(212,175,55,0.12);
    --ink:#0F2225; --charcoal:#1A3035; --warm-mid:#3A5A60; --border-soft:#B0DDE6;
    --font-serif:'Cormorant Garamond',Georgia,serif; --font-sans:'Outfit',sans-serif; --font-mono:'DM Mono',monospace;
    --radius-sm:8px; --trans-luxury:0.6s cubic-bezier(.16,1,.3,1);
    --bg:var(--cream); --text:var(--ink); --text-muted:var(--warm-mid);
  }
  [data-theme="dark"]{ --bg:#0F1A1C; --text:#F5F5F5; --text-muted:#8AABB0; --border-soft:#263840; --gold-dim:rgba(212,175,55,0.1); }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--charcoal);color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
  body::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 25% 30%,rgba(212,175,55,.12) 0%,transparent 50%),radial-gradient(circle at 78% 68%,rgba(110,198,207,.08) 0%,transparent 50%)}
  .wrap{position:relative;z-index:2;max-width:460px;padding:24px}
  .ribbon{font-size:3.2rem;margin-bottom:18px;animation:sway 3s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  @media (prefers-reduced-motion: reduce){.ribbon{animation:none}}
  .code{font-family:var(--font-mono);font-size:12px;letter-spacing:.15em;color:#D4AF37;text-transform:uppercase;margin-bottom:14px}
  h1{font-family:var(--font-serif);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:600;margin-bottom:12px;color:var(--cream)}
  h1 em{font-style:italic;color:#D4AF37}
  p{color:rgba(230,247,250,.65);font-size:14.5px;line-height:1.8;margin-bottom:28px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn-primary{padding:13px 28px;background:linear-gradient(135deg,#B8791A,#D4AF37);color:var(--ink);border-radius:var(--radius-sm);font-weight:600;font-size:14px;text-decoration:none;transition:all var(--trans-luxury);box-shadow:0 8px 28px rgba(184,121,26,.3)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(184,121,26,.4)}
  .btn-outline{padding:12px 26px;border:1.5px solid rgba(230,247,250,.25);color:var(--cream);border-radius:var(--radius-sm);font-weight:500;font-size:14px;text-decoration:none;transition:all .28s}
  .btn-outline:hover{border-color:#D4AF37;color:#D4AF37}
</style>
</head>
<body>
  <div class="wrap">
    <div class="ribbon" aria-hidden="true">🎀</div>
    <p class="code">Error 404</p>
    <h1>This <em>gift</em> got lost in transit</h1>
    <p>The page you're looking for doesn't exist, or the link may be out of date. Let's get you back to something worth unwrapping.</p>
    <div class="actions">
      <a class="btn-primary" href="index.html">← Back to Home</a>
      <a class="btn-outline" href="index.html#products">Browse Gifts</a>
    </div>
  </div>
</body>
</html>
